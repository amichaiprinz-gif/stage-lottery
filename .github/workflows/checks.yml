# Runs on every pull request and on main. No secrets, read-only token, GitHub's own runners.
name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: every number has a source and a date
        run: python3 tools/check_sources.py
      - name: the product's own tests, when they exist
        run: if [ -f tests/run.sh ]; then bash tests/run.sh; else echo "no tests/run.sh yet"; fi
